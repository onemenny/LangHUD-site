  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="190" y="110" width="900" height="500" rx="22" fill="#0f172a" opacity="0.92"/>
  <rect x="190" y="110" width="900" height="52" rx="22" fill="#1e293b"/>
